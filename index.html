<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#2f5bd3" />
    <title>Coverfold</title>
    <script>
      // Theme before first paint (no white flash in dark mode). Kept in sync with src/ui/theme.ts.
      try {
        var t = localStorage.getItem('coverfold.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Anonymous visit count, no cookies (https://www.goatcounter.com). It skips localhost on its own. -->
    <script data-goatcounter="https://coverfold.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
