<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Coverfold: page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #eceef2; color: #1d1f24; }
      main { text-align: center; padding: 2rem 1.25rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #6b7180; }
      a { display: inline-block; padding: 0.55rem 1rem; border-radius: 6px; background: #2f5bd3; color: #fff; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #14161a; color: #e7e9ee; }
        p { color: #9aa1b0; }
        a { background: #5b7ff0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address.</p>
      <a href="/">Open Coverfold</a>
    </main>
  </body>
</html>
