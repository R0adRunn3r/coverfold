name: Bug report
description: Something does not work, or prints or folds wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. You can write in English or Italian.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template and measurements
      description: For printing or assembly problems.
      placeholder: Sleeve with flap, tucked-in flap, 18 mm
  - type: input
    id: printer
    attributes:
      label: Printer and paper
      description: For printing problems.
      placeholder: Epson ET-8550, matte cardstock 280 g/m²
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 140, Windows 11
  - type: textarea
    id: files
    attributes:
      label: Screenshots or files
      description: Drop images or the PDF here if they help.
